name: Backend CI
permissions:
  id-token: write
on:
  push:
    branches: [ main, develop ]
    paths:
      - "backend-service/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "backend-service/**"
      - ".github/workflows/backend-ci.yml"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend-service/target/surefire-reports/

      - name: Upload coverage reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: backend-service/target/site/

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: backend-service/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Validate AWS publish secrets
        shell: bash
        run: |
          [[ -n "$AWS_REGION" ]] || { echo "Missing GitHub secret: AWS_REGION"; exit 1; }
          [[ -n "$AWS_ROLE_ARN" ]] || { echo "Missing GitHub secret: AWS_ROLE_ARN"; exit 1; }
          [[ -n "$ECR_REPOSITORY" ]] || { echo "Missing GitHub secret: ECR_REPOSITORY"; exit 1; }

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract ECR registry
        if: github.event_name == 'push'
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Tag image with commit SHA
        if: github.event_name == 'push'
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push images to ECR
        if: github.event_name == 'push'
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}                     
